<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aletheia — Claim Verification Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F6F4EF;
    --paper-dark: #EAE6D8;
    --ink: #111111;
    --tan: #B89860;
    --tan-dark: #8C6E3F;
    --red: #AB2319;
    --green: #2B693A;
    --amber: #C97E0C;
    --pencil: #524E48;
    --rule: #D1CBB8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(0,0,0,0.015) 0%, transparent 50%),
      radial-gradient(circle at 80% 90%, rgba(0,0,0,0.015) 0%, transparent 50%);
    color: var(--ink);
    font-family: 'Source Serif 4', serif;
    min-height: 100vh;
  }

  /* Typography */
  h1, h2, h3, h4 { margin: 0; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .elite { font-family: 'Special Elite', monospace; letter-spacing: 0.05em; }
  
  /* Layout */
  .masthead {
    padding: 24px 32px;
    border-bottom: 2px solid var(--ink);
    display: flex; justify-content: space-between; align-items: flex-end;
  }
  .masthead h1 { font-size: 24px; font-family: 'Special Elite', monospace; color: var(--ink); }
  .masthead span { color: var(--red); }
  
  .wrap { max-width: 1100px; margin: 40px auto; display: grid; grid-template-columns: 320px 1fr; gap: 40px; padding: 0 32px; }
  
  /* Form */
  .intake { background: var(--paper-dark); padding: 24px; border: 1px solid var(--rule); }
  .field-label { display: block; margin-top: 16px; margin-bottom: 8px; font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--pencil); font-weight: 600; letter-spacing: 0.05em;}
  .field-label:first-child { margin-top: 0; }
  textarea, input[type="text"] {
    width: 100%; padding: 12px; background: var(--paper); border: 1px solid var(--rule); font-family: 'Source Serif 4', serif; font-size: 15px; color: var(--ink);
  }
  textarea { height: 160px; resize: vertical; }
  textarea:focus, input:focus, button:focus { outline: 2px solid var(--tan-dark); outline-offset: -1px; }
  
  .submit-btn {
    width: 100%; margin-top: 24px; padding: 14px; background: var(--ink); color: var(--paper); border: none; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.05em; cursor: pointer;
  }
  .submit-btn:hover { background: var(--red); }
  .submit-btn:disabled { opacity: 0.5; pointer-events: none; }
  
  /* Results area */
  .results { padding-bottom: 80px; }
  .section-title {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--pencil); border-bottom: 1px solid var(--rule); padding-bottom: 8px; margin: 40px 0 20px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
  }
  
  /* Verdict Header */
  .verdict-header { display: flex; align-items: baseline; gap: 24px; margin-bottom: 24px; }
  .stamp {
    font-family: 'Special Elite', monospace; font-size: 32px; padding: 10px 24px; border: 4px solid currentColor; border-radius: 4px; display: inline-block; transform: rotate(-3deg);
  }
  .stamp.fake { color: var(--red); }
  .stamp.real { color: var(--green); }
  .stamp.unverified { color: var(--amber); }
  .confidence { font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: var(--pencil); }
  .confidence b { color: var(--ink); font-size: 16px;}
  
  .reasoning-box { background: var(--paper-dark); border-left: 4px solid var(--tan); padding: 20px 24px; font-size: 17px; line-height: 1.6; margin-bottom: 40px; }
  
  /* Claim Cards */
  .claim-group { margin-bottom: 32px; }
  .claim-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; padding: 12px; background: rgba(0,0,0,0.03); border: 1px solid var(--rule); }
  
  /* Evidence Card */
  .evidence-card { border: 1px solid var(--rule); padding: 16px; margin-bottom: 12px; background: #fff; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: start; }
  .ev-source { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink); font-weight: 600; display: block; margin-bottom: 4px;}
  .ev-title { color: var(--pencil); font-size: 14px; display: block; margin-bottom: 8px; text-decoration: none;}
  .ev-title:hover { text-decoration: underline; color: var(--ink);}
  
  .stance-badge { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 3px; display: inline-block; }
  .stance-badge.supports { background: rgba(43, 105, 58, 0.1); color: var(--green); border: 1px solid var(--green); }
  .stance-badge.contradicts { background: rgba(171, 35, 25, 0.1); color: var(--red); border: 1px solid var(--red); }
  .stance-badge.neutral { background: rgba(0,0,0,0.05); color: var(--pencil); border: 1px solid var(--rule); }

  /* Image Verification */
  .image-box { border: 1px solid var(--rule); background: var(--paper-dark); padding: 20px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.5; }
  
  /* Technical details */
  .tech-details { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--pencil); border-top: 1px dashed var(--rule); padding-top: 16px; margin-top: 60px; line-height: 1.6; }

  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="masthead">
  <h1>Aletheia<span>.</span></h1>
  <div class="mono" style="font-size: 12px; color: var(--pencil); text-align: right;">AI-ASSISTED<br>VERIFICATION CONSOLE</div>
</div>

<div class="wrap">
  <div class="intake">
    <label class="field-label">ARTICLE / CLAIM TEXT</label>
    <textarea id="articleInput" placeholder="Paste claim here..."></textarea>
    
    <label class="field-label">IMAGE URL (OPTIONAL)</label>
    <input type="text" id="imageInput" placeholder="https://..." />
    
    <button class="submit-btn" id="submitBtn">START VERIFICATION</button>
  </div>
  
  <div class="results" id="results">
    <div style="text-align: center; color: var(--pencil); margin-top: 60px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; opacity: 0.7;">
      AWAITING INPUT...
    </div>
  </div>
</div>

<script>
const API_ENDPOINT = 'http://localhost:8000/verify';
const btn = document.getElementById('submitBtn');
const resultsDiv = document.getElementById('results');

btn.addEventListener('click', async () => {
  const article = document.getElementById('articleInput').value.trim();
  const image = document.getElementById('imageInput').value.trim();
  
  if (!article) return alert('Article text is required.');
  
  btn.disabled = true;
  btn.textContent = 'PROCESSING...';
  
  resultsDiv.innerHTML = `
    <div style="font-family: 'IBM Plex Mono', monospace; color: var(--pencil); line-height: 2;">
      ✓ Extracting claims...<br>
      ✓ Querying trusted databases...<br>
      ✓ Analyzing semantic stance...<br>
      <span style="opacity: 0.5;">● Aggregating evidence...</span>
    </div>`;

  try {
    const res = await fetch(API_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ article, image_url: image || null })
    });
    if (!res.ok) throw new Error('API failed');
    const data = await res.json();
    renderResults(data);
  } catch (err) {
    resultsDiv.innerHTML = `<div style="color: red; font-family: monospace;">ERROR: ${err.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'START VERIFICATION';
  }
});

function renderResults(data) {
  const verdict = data.final_verdict || 'UNVERIFIED';
  const conf = data.confidence ? (data.confidence * 100).toFixed(0) : '--';
  const vClass = verdict === 'FAKE' ? 'fake' : verdict === 'REAL' ? 'real' : 'unverified';
  
  let html = `
    <div class="verdict-header">
      <div class="stamp ${vClass}">${verdict}</div>
      <div class="confidence">CONFIDENCE: <b>${conf}%</b></div>
    </div>
    <div class="section-title">Final Reasoning</div>
    <div class="reasoning-box">${data.reasoning || 'No reasoning available.'}</div>
  `;

  // Claims and Evidence Stance
  const claims = data.claims || [];
  const stances = data.stance_analysis || [];
  
  if (claims.length > 0) {
    html += `<div class="section-title">Claim Breakdown & Evidence</div>`;
    claims.forEach((c, idx) => {
      html += `<div class="claim-group">
        <div class="claim-title"><span style="color:var(--pencil); font-family: monospace; font-size:12px;">CLAIM ${(idx+1).toString().padStart(2, '0')}</span><br>${c.text}</div>`;
      
      const relatedEv = stances.filter(s => s.claim_id === c.claim_id);
      if (relatedEv.length > 0) {
        relatedEv.forEach(ev => {
           const stanceClass = ev.stance.toLowerCase();
           html += `
             <div class="evidence-card">
               <div>
                 <span class="ev-source">${new URL(ev.evidence_url).hostname.replace('www.','')}</span>
                 <a href="${ev.evidence_url}" class="ev-title" target="_blank">${ev.evidence_url}</a>
               </div>
               <div class="stance-badge ${stanceClass}">${ev.stance}</div>
             </div>`;
        });
      } else {
         html += `<div style="font-family: monospace; font-size: 13px; color: var(--pencil); padding: 8px;">No direct evidence analyzed for this specific claim.</div>`;
      }
      html += `</div>`;
    });
  }

  // Source Credibility
  const creds = data.source_credibility || [];
  if (creds.length > 0) {
    html += `<div class="section-title">Source Credibility Matrix</div>
    <div style="font-family: monospace; font-size: 13px;">`;
    creds.forEach(c => {
      html += `<div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--rule);">
        <span>${c.domain}</span>
        <span style="color: ${c.credibility_score > 0.7 ? 'var(--green)' : 'var(--amber)'}">${(c.credibility_score * 100).toFixed(0)} / 100</span>
      </div>`;
    });
    html += `</div>`;
  }

  // Technical details
  html += `<div class="tech-details">
    <b>TECHNICAL ANALYSIS:</b><br>`;
  if (data._debug_style_classifier) {
    html += `Stylistic Classifier: ${data._debug_style_classifier.label} (${(data._debug_style_classifier.confidence * 100).toFixed(1)}%)<br>`;
  }
  if (data.warnings && data.warnings.length > 0) {
    html += `Warnings: ${data.warnings.join(', ')}<br>`;
  }
  html += `</div>`;

  resultsDiv.innerHTML = html;
}
</script>
</body>
</html>
